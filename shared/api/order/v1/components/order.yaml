type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
#  - transaction_uuid
#  - paymen_method
  - status
properties:
  order_uuid:
    type: string
    description: Уникальный идентификатор заказа (UUID)
    example: "eddc9b62-5d9b-4927-9e20-85bfd177c863"
  user_uuid:
    type: string
    description: UUID пользователя
    example: "d06f6d6c-7c19-4e57-9bf5-2afff15ebfcd"
  part_uuids: #тут нужно доделать
    type: array
    items:
      type: string
    description: Список UUID деталей
    example: "['58478a62-8b91-4f0b-8e14-3f7eccfa5ad4', 'abb0ce26-9a98-4dcb-96be-ca87d1517b71']"
  total_price:
    type: number
    format: float
    description: Итоговая стоимость
    example: "123.45"
  transaction_uuid:
    type: string
    description: uuid транзакции (если оплачен)
    example: "eddc9b62-5d9b-4927-9e20-85bfd177c863"
  payment_method:
    type: integer
    enum: [0, 1, 2, 3, 4]
    description: |
      Способ оплаты:
      0 – Неизвестный
      1 – Банковская карта
      2 – СБП
      3 – Кредитная карта
      4 – Деньги инвестора
    example: 1
#  paymen_method:
#    type: integer
#    oneOf:
#      - const: 0
#        title: UNKNOWN
#        description: Неизвестный способ
#      - const: 1
#        title: CARD
#        description: Банковская карта
#      - const: 2
#        title: SBP
#        description: Система быстрых платежей
#      - const: 3
#        title: CREDIT_CARD
#        description: Кредитная карта
#      - const: 4
#        title: INVESTOR_MONEY
#        description: Деньги инвестора
#    description: способ оплаты (если оплачен)
#    example: "CARD"
  status:
    type: string
    enum: [PENDING_PAYMENT, PAID, CANCELLED]
    description: Статус оплаты
    example: "PAID"

