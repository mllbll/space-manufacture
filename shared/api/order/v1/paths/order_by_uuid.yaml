#нужно указать правильный ref parameters:
parameters:
  - $ref: ../params/order_uuid.yaml

get:
  summary: Get order data by uuid 
  orerationId: GetOrderByUuid
  tags: 
    - Order 
  responses:
    '200':
      description: Order information successfully retrieved
      content:
        application/json:
          schema:
 #           $ref: ../components/get_order_response.yaml
            $ref: ../components/order.yaml

    '404':
      description: Order data not found
      content:
        application/json:
          schema:
            $ref: ../components/errors/not_found_error.yaml
    '400':
      description: Bad request - validation error 
      content:
        application/json:
          schema:
            $ref: ../components/errors/bad_request_error.yaml
    '500':
      description: Initial server error 
      content:
        application/json:
          schema:
            $ref: ../components/errors/internal_server_error.yaml
    default:
      description: Unexpected error 
      content:
        application/json:
          schema:
            $ref: ../components/errors/generic_error.yaml
          
